<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Player Match</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 30px;
        }

        p {
            color: #bbb;
            font-size: 19px;
            line-height: 1.5;
        }

        button {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 14px auto;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.03);
        }

        #quiz {
            display: none;
        }

        #result {
            display: none;
        }

        .progress {
            color: #888;
            margin-bottom: 25px;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- PORTADA -->

    <div id="home">

        <h1>🏀 NBA Player Match</h1>

        <p>
            Descubre a qué jugador NBA se parece realmente
            tu estilo de juego.
        </p>

        <button onclick="startQuiz()">
            Descubrir mi jugador
        </button>

    </div>


    <!-- CUESTIONARIO -->

    <div id="quiz">

        <div class="progress" id="progress"></div>

        <h2 id="question"></h2>

        <div id="answers"></div>

    </div>


    <!-- RESULTADO -->

    <div id="result">

        <h1>🏆 Tu perfil</h1>

        <p id="resultText"></p>

        <button onclick="location.reload()">
            Volver a empezar
        </button>

    </div>


</div>


<script>


// --------------------------------
// DATOS DEL CUESTIONARIO
// --------------------------------

const questions = [

    {
        question: "¿Cuál es tu posición principal?",
        answers: [
            "Base",
            "Escolta",
            "Alero",
            "Ala-pívot",
            "Pívot"
        ]
    },

    {
        question: "¿Cómo valorarías tu tiro de 3?",
        answers: [
            "Muy malo",
            "Malo",
            "Normal",
            "Bueno",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo valorarías tu manejo de balón?",
        answers: [
            "Muy malo",
            "Malo",
            "Normal",
            "Bueno",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo eres finalizando cerca del aro?",
        answers: [
            "Muy malo",
            "Malo",
            "Normal",
            "Bueno",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo valorarías tu capacidad de pase?",
        answers: [
            "Muy mala",
            "Mala",
            "Normal",
            "Buena",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo valorarías tu defensa?",
        answers: [
            "Muy mala",
            "Mala",
            "Normal",
            "Buena",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo eres jugando sin balón?",
        answers: [
            "Muy malo",
            "Malo",
            "Normal",
            "Bueno",
            "Excelente"
        ]
    },

    {
        question: "¿Cómo valorarías tu velocidad y explosividad?",
        answers: [
            "Muy baja",
            "Baja",
            "Normal",
            "Alta",
            "Muy alta"
        ]
    },

    {
        question: "¿Cuánto dependes del balón para ser útil?",
        answers: [
            "Casi nada",
            "Poco",
            "Normal",
            "Bastante",
            "Muchísimo"
        ]
    },

    {
        question: "¿Cuál describe mejor tu estilo?",
        answers: [
            "Organizador",
            "Anotador",
            "Tirador",
            "Atacante del aro",
            "Jugador completo"
        ]
    }

];


// --------------------------------
// VARIABLES
// --------------------------------

let currentQuestion = 0;

let playerAnswers = [];


// --------------------------------
// EMPEZAR
// --------------------------------

function startQuiz() {

    document.getElementById("home").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    showQuestion();

}


// --------------------------------
// MOSTRAR PREGUNTA
// --------------------------------

function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "Pregunta " + (currentQuestion + 1) +
        " de " + questions.length;

    document.getElementById("question").innerText =
        question.question;

    const answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";


    question.answers.forEach(function(answer, index) {

        const button = document.createElement("button");

        button.innerText = answer;

        button.onclick = function() {

            selectAnswer(index, answer);

        };

        answersDiv.appendChild(button);

    });

}


// --------------------------------
// GUARDAR RESPUESTA
// --------------------------------

function selectAnswer(index, answer) {

    playerAnswers.push({
        question: currentQuestion,
        answer: answer,
        score: index + 1
    });


    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}

const players = [

    {
        name: "Stephen Curry",
        scores: [1, 5, 5, 4, 4, 3, 5, 5, 5, 3]
    },

    {
        name: "Shai Gilgeous-Alexander",
        scores: [1, 5, 5, 5, 4, 4, 5, 5, 5, 2]
    },

    {
        name: "Luka Dončić",
        scores: [1, 5, 5, 4, 5, 3, 4, 3, 5, 1]
    },

    {
        name: "Anthony Edwards",
        scores: [2, 4, 5, 5, 3, 4, 3, 5, 4, 2]
    },

    {
        name: "Devin Booker",
        scores: [2, 5, 4, 4, 4, 3, 5, 4, 4, 2]
    },

    {
        name: "Jalen Brunson",
        scores: [1, 5, 5, 5, 4, 3, 4, 4, 5, 2]
    },

    {
        name: "LeBron James",
        scores: [3, 4, 4, 5, 5, 5, 4, 5, 4, 5]
    },

    {
        name: "Jayson Tatum",
        scores: [3, 4, 4, 5, 4, 5, 5, 4, 4, 5]
    },

    {
        name: "Nikola Jokić",
        scores: [5, 4, 3, 5, 5, 4, 4, 2, 3, 5]
    },

    {
        name: "Giannis Antetokounmpo",
        scores: [5, 2, 3, 5, 5, 5, 3, 5, 2, 5]
    }

];
// --------------------------------
// RESULTADO TEMPORAL
// --------------------------------

function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";


    let rankings = [];


    players.forEach(function(player) {

        let difference = 0;


        for (let i = 0; i < player.scores.length; i++) {

            difference += Math.abs(
                playerAnswers[i].score - player.scores[i]
            );

        }


        rankings.push({

            name: player.name,

            difference: difference

        });

    });


    rankings.sort(function(a, b) {

        return a.difference - b.difference;

    });


    let topPlayers = rankings.slice(0, 3);


let resultHTML = "<strong>🏆 Tus 3 jugadores más parecidos</strong><br><br>";


topPlayers.forEach(function(player, index) {

    let similarity =
        Math.round(
            100 - (player.difference / 40 * 100)
        );

    resultHTML +=
        "<strong>" +
        (index + 1) +
        ". " +
        player.name +
        "</strong>" +
        " — " +
        similarity +
        "%<br><br>";

});


document.getElementById("resultText").innerHTML = resultHTML;

}

</script>

</body>

</html>
