<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Player Match</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #bbb;
            line-height: 1.5;
        }

        button {
            margin-top: 30px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.04);
        }

        #quiz {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="home">

            <h1>🏀 NBA Player Match</h1>

            <p>
                Descubre a qué jugador NBA se parece realmente
                tu estilo de juego.
            </p>

            <button onclick="startQuiz()">
                Descubrir mi jugador
            </button>

        </div>


        <div id="quiz">

            <h1>🏀 Cuestionario</h1>

            <p>
                Aquí empezará tu análisis de jugador.
            </p>

            <button onclick="goBack()">
                Volver
            </button>

        </div>

    </div>


    <script>

        function startQuiz() {

            document.getElementById("home").style.display = "none";

            document.getElementById("quiz").style.display = "block";

        }


        function goBack() {

            document.getElementById("quiz").style.display = "none";

            document.getElementById("home").style.display = "block";

        }

    </script>

</body>
</html>
