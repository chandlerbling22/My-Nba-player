<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NBA Player Match</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

        }


        .container {

            max-width: 700px;

            margin: auto;

            padding: 50px 20px;

            text-align: center;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 20px;

        }


        h2 {

            font-size: 30px;

            margin-bottom: 25px;

        }


        p {

            color: #bbb;

            font-size: 19px;

            line-height: 1.5;

        }


        button {

            display: block;

            width: 85%;

            max-width: 450px;

            margin: 14px auto;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

        }


        button:hover {

            transform: scale(1.03);

        }


        #quiz {

            display: none;

        }


        #result {

            display: none;

        }


        .progress {

            color: #888;

            margin-bottom: 20px;

            font-size: 15px;

        }


        .scale {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 8px;

            max-width: 500px;

            margin: 25px auto;

        }


        .scale button {

            width: 100%;

            margin: 0;

        }


        .scale-number {

            font-size: 20px;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- PORTADA -->

    <div id="home">

        <h1>🏀 NBA Player Match</h1>

        <p>

            Descubre a qué jugador NBA se parece realmente
            tu estilo de juego.

        </p>


        <button onclick="startQuiz()">

            Descubrir mi jugador

        </button>

    </div>



    <!-- CUESTIONARIO -->

    <div id="quiz">

        <div class="progress"
             id="progress">
        </div>


        <h2 id="question">
        </h2>


        <p id="description">
        </p>


        <div class="scale"
             id="answers">
        </div>

    </div>



    <!-- RESULTADO -->

    <div id="result">

        <h1>🏆 Tu perfil</h1>


        <p id="resultText">
        </p>


        <button onclick="location.reload()">

            Volver a empezar

        </button>

    </div>


</div>



<script>


// ========================================
// PREGUNTAS
// ========================================

const questions = [


    {

        name: "triple",

        question: "¿Cómo valorarías tu tiro de 3?",

        description:
        "Piensa en tu capacidad real para meter triples en partido."

    },


    {

        name: "midrange",

        question: "¿Cómo es tu tiro de media distancia?",

        description:
        "Tiros desde 4-5 metros, pull-ups y tiros tras bote."

    },


    {

        name: "finishing",

        question: "¿Cómo eres finalizando cerca del aro?",

        description:
        "Entradas, bandejas, contacto y definición."

    },


    {

        name: "handles",

        question: "¿Cómo valorarías tu manejo de balón?",

        description:
        "Control, cambios de dirección y capacidad para proteger el balón."

    },


    {

        name: "creation",

        question: "¿Qué tal eres creando tu propio tiro?",

        description:
        "Capacidad para generar separación y conseguir un tiro."

    },


    {

        name: "passing",

        question: "¿Cómo valorarías tu pase?",

        description:
        "Visión, pases difíciles y capacidad para encontrar compañeros."

    },


    {

        name: "pickroll",

        question: "¿Qué tal juegas el pick & roll?",

        description:
        "Tomar decisiones con bloqueo directo y atacar la defensa."

    },


    {

        name: "offball",

        question: "¿Cómo juegas sin balón?",

        description:
        "Cortes, bloqueos, movimiento y encontrar espacios."

    },


    {

        name: "perimeterDefense",

        question: "¿Cómo eres defendiendo en el perímetro?",

        description:
        "Defender jugadores exteriores y contener penetraciones."

    },


    {

        name: "interiorDefense",

        question: "¿Cómo eres defendiendo cerca del aro?",

        description:
        "Defensa interior, ayudas y protección del aro."

    },


    {

        name: "rebounding",

        question: "¿Cómo eres reboteando?",

        description:
        "Capacidad para capturar rebotes ofensivos y defensivos."

    },


    {

        name: "explosiveness",

        question: "¿Cómo valorarías tu explosividad?",

        description:
        "Aceleración, primer paso y capacidad de salto."

    },


    {

        name: "transition",

        question: "¿Qué tal juegas en transición?",

        description:
        "Contraataques, correr la pista y tomar decisiones a velocidad."

    },


    {

        name: "physical",

        question: "¿Cómo valorarías tu físico para jugar al baloncesto?",

        description:
        "Fuerza, contacto y capacidad para aguantar físicamente."

    },


    {

        name: "versatility",

        question: "¿Qué tan completo eres como jugador?",

        description:
        "Capacidad para aportar en diferentes aspectos del juego."

    }

];



// ========================================
// VARIABLES
// ========================================

let currentQuestion = 0;


let playerProfile = {};



// ========================================
// EMPEZAR
// ========================================

function startQuiz() {


    document.getElementById("home")
        .style.display = "none";


    document.getElementById("quiz")
        .style.display = "block";


    showQuestion();

}



// ========================================
// MOSTRAR PREGUNTA
// ========================================

function showQuestion() {


    const question =
        questions[currentQuestion];


    document.getElementById("progress")
        .innerText =
        "Pregunta " +
        (currentQuestion + 1) +
        " de " +
        questions.length;


    document.getElementById("question")
        .innerText =
        question.question;


    document.getElementById("description")
        .innerText =
        question.description;


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";



    for (let i = 1; i <= 10; i++) {


        const button =
            document.createElement("button");


        button.className =
            "scale-number";


        button.innerText = i;


        button.onclick =
        function() {

            selectAnswer(i);

        };


        answers.appendChild(button);

    }

}



// ========================================
// GUARDAR RESPUESTA
// ========================================

function selectAnswer(score) {


    const question =
        questions[currentQuestion];


    playerProfile[question.name] =
        score;


    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {


        showQuestion();


    } else {


        showResult();

    }

}



// ========================================
// RESULTADO
// ========================================

function showResult() {


    document.getElementById("quiz")
        .style.display = "none";


    document.getElementById("result")
        .style.display = "block";


    let profileHTML =

        "<strong>Tu perfil de jugador</strong><br><br>";


    questions.forEach(function(question) {


        profileHTML +=

            question.question +

            ": " +

            playerProfile[question.name] +

            "/10<br>";

    });


    document.getElementById("resultText")
        .innerHTML =
        profileHTML;

}

</script>


</body>

</html>
