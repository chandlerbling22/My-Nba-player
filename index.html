<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Match</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #bbb;
            line-height: 1.5;
        }

        button {
            margin-top: 25px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #111;
        }

        button:hover {
            transform: scale(1.04);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🏀 NBA Player Match</h1>

        <p>
            Descubre a qué jugador NBA se parece realmente
            tu estilo de juego.
        </p>

        <button>Descubrir mi jugador</button>
    </div>

</body>
</html>
