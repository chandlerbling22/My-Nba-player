<!DOCTYPE html>

    <style>

        body {

            max-width: 700px;

            margin: auto;

            padding: 50px 20px;

            text-align: center;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 20px;

        }


        h2 {

            font-size: 30px;

            margin-bottom: 25px;

        }


        p {

            color: #bbb;

            font-size: 19px;

            line-height: 1.5;

        }


        button {

            display: block;

            width: 85%;

            max-width: 450px;

            margin: 14px auto;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

        }


        button:hover {

            transform: scale(1.03);

        }


        #quiz {

        }


        #result {

            display: none;

        }


        .progress {

            color: #888;

            margin-bottom: 20px;

            font-size: 15px;

        }


        .scale {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 8px;

            max-width: 500px;

            margin: 25px auto;

        }


        .scale button {

            width: 100%;

            margin: 0;

        }


        .scale-number {

            font-size: 20px;

        }

    </style>

</head>

function startQuiz() {


    document.getElementById("home")
        .style.display = "none";


    document.getElementById("quiz")
        .style.display = "block";


    showQuestion();

}



// ========================================
// MOSTRAR PREGUNTA
// ========================================

function showQuestion() {


    const question =
        questions[currentQuestion];


    document.getElementById("progress")
        .innerText =
        "Pregunta " +
        (currentQuestion + 1) +
        " de " +
        questions.length;


    document.getElementById("question")
        .innerText =
        question.question;


    document.getElementById("description")
        .innerText =
        question.description;


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";



    for (let i = 1; i <= 10; i++) {


        const button =
            document.createElement("button");


        button.className =
            "scale-number";


        button.innerText = i;


        button.onclick =
        function() {

            selectAnswer(i);

        };


        answers.appendChild(button);

    }

}



// ========================================
// GUARDAR RESPUESTA
// ========================================

function selectAnswer(score) {


    const question =
        questions[currentQuestion];


    playerProfile[question.name] =
        score;


    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {


        showQuestion();


    } else {


        showResult();

    }

}

function analyzeTargetPlayer() {

    const selectedName =
        document.getElementById("targetPlayer").value;

    if (!selectedName) {
        alert("Selecciona primero un jugador.");
        return;
    }

    const targetPlayer =
        nbaPlayers.find(function(player) {
            return player.name === selectedName;
        });

    let differences = [];

    questions.forEach(function(question) {

        const userScore =
            playerProfile[question.name];

        const targetScore =
            targetPlayer.profile[question.name];

        differences.push({
            question: question.question,
            userScore: userScore,
            targetScore: targetScore,
            difference: targetScore - userScore
        });

    });

    differences.sort(function(a, b) {
        return b.difference - a.difference;
    });

    const priorities =
        differences
            .filter(function(item) {
                return item.difference > 0;
            })
            .slice(0, 5);

    let prioritiesHTML = "";

    priorities.forEach(function(item, index) {

        prioritiesHTML += `

            <div style="
                margin: 12px 0;
                padding: 15px;
                background: #1b1b1b;
                border-radius: 12px;
                border: 1px solid #333;
            ">

                <div style="
                    font-size: 13px;
                    color: #888;
                    margin-bottom: 5px;
                ">
                    PRIORIDAD ${index + 1}
                </div>

                <strong>
                    ${item.question}
                </strong>

                <div style="
                    margin-top: 8px;
                    color: #aaa;
                ">
                    Tú: ${item.userScore}/10
                    ·
                    ${targetPlayer.name}: ${item.targetScore}/10
                </div>

            </div>

        `;

    });

    if (priorities.length === 0) {

        prioritiesHTML = `

            <div style="
                padding: 20px;
                background: #1b1b1b;
                border-radius: 12px;
            ">

                🔥 Tu perfil ya está muy cerca del de
                <strong>${targetPlayer.name}</strong>.

            </div>

        `;

    }

    let totalDifference = 0;

    questions.forEach(function(question) {

        totalDifference += Math.abs(
            playerProfile[question.name] -
            targetPlayer.profile[question.name]
        );

    });

    const maxDifference =
        questions.length * 9;

    const targetSimilarity = Math.round(
        (1 - totalDifference / maxDifference) * 100
    );

    const targetAnalysis =
        document.getElementById("targetAnalysis");

    targetAnalysis.innerHTML = `

        <hr style="
            border: none;
            border-top: 1px solid #333;
            margin: 40px 0;
        ">

        <div style="text-align: center;">

            <p style="
                color: #888;
                font-size: 13px;
            ">
                OBJETIVO
            </p>

            <h2 style="
                font-size: 32px;
                margin: 8px 0;
            ">
                ${targetPlayer.name}
            </h2>

            <p style="
                font-size: 28px;
                font-weight: bold;
            ">
                ${targetSimilarity}%
            </p>

            <p style="
                color: #aaa;
            ">
                de similitud con tu perfil actual
            </p>

        </div>

        <h2 style="
            margin-top: 35px;
        ">
            📈 Tus 5 prioridades
        </h2>

        <p style="
            color: #999;
            font-size: 14px;
        ">
            Estas son las áreas donde tienes mayor distancia respecto a ${targetPlayer.name}.
        </p>

        ${prioritiesHTML}

    `;

    targetAnalysis.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}
</script>


</body>

</html>
