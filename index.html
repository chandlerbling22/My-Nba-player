<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Player Match</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 20px;
            color: #bbb;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.04);
        }

        #quiz {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="home">

            <h1>🏀 NBA Player Match</h1>

            <p>
                Descubre a qué jugador NBA se parece realmente
                tu estilo de juego.
            </p>

            <button onclick="startQuiz()">
                Descubrir mi jugador
            </button>

        </div>


        <div id="quiz">

            <h1>🏀 Tu perfil de jugador</h1>

            <p>¿Cuál es tu posición principal?</p>

            <button onclick="answer('Base')">Base</button>

            <button onclick="answer('Escolta')">Escolta</button>

            <button onclick="answer('Alero')">Alero</button>

            <button onclick="answer('Ala-pívot')">Ala-pívot</button>

            <button onclick="answer('Pívot')">Pívot</button>

            <p id="answer"></p>

        </div>

    </div>


    <script>

        function startQuiz() {

            document.getElementById("home").style.display = "none";

            document.getElementById("quiz").style.display = "block";

        }


        function answer(position) {

            document.getElementById("answer").innerText =
                "Has elegido: " + position;

        }

    </script>

</body>
</html>
