    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

        }


        .container {

            max-width: 700px;

            margin: auto;

            padding: 50px 20px;

            text-align: center;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 20px;

        }


        h2 {

            margin-bottom: 25px;

        }


        p {

            color: #bbb;

            font-size: 19px;

            line-height: 1.5;

        }


        button {

            display: block;

            width: 85%;

            max-width: 450px;

            margin: 14px auto;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

        }


        button:hover {

            transform: scale(1.03);

        }


        #quiz {

            display: none;

        }


        #result {

            display: none;

        }


        .progress {

            color: #888;

            margin-bottom: 20px;

            font-size: 15px;

        }


        .scale {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 8px;

            max-width: 500px;

            margin: 25px auto;

        }


        .scale button {

            width: 100%;

            margin: 0;

        }


        .scale-number {

            font-size: 20px;

        }

    </style>

</head>

// ========================================
// EMPEZAR
// ========================================

function startQuiz() {


    document.getElementById("home")
        .style.display = "none";


    document.getElementById("quiz")
        .style.display = "block";


    showQuestion();

}



// ========================================
// MOSTRAR PREGUNTA
// ========================================

function showQuestion() {


    const question =
        questions[currentQuestion];


    document.getElementById("progress")
        .innerText =
        "Pregunta " +
        (currentQuestion + 1) +
        " de " +
        questions.length;


    document.getElementById("question")
        .innerText =
        question.question;


    document.getElementById("description")
        .innerText =
        question.description;


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";



    for (let i = 1; i <= 10; i++) {


        const button =
            document.createElement("button");


        button.className =
            "scale-number";


        button.innerText = i;


        button.onclick =
        function() {

            selectAnswer(i);

        };


        answers.appendChild(button);

    }

}



// ========================================
// GUARDAR RESPUESTA
// ========================================

function selectAnswer(score) {


    const question =
        questions[currentQuestion];


    playerProfile[question.name] =
        score;


    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {


        showQuestion();


    } else {


        showResult();

    }

}



// ========================================
// RESULTADO
// ========================================

function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    let results = [];

    nbaPlayers.forEach(function(player) {

        let totalDifference = 0;

        questions.forEach(function(question) {

            const userScore = playerProfile[question.name];
            const playerScore = player.ratings[question.name];

            totalDifference += Math.abs(userScore - playerScore);

        });

        const maxDifference = questions.length * 9;

        const similarity = Math.round(
            (1 - totalDifference / maxDifference) * 100
        );

        results.push({
            player: player,
            similarity: similarity
        });

    });


    results.sort(function(a, b) {
        return b.similarity - a.similarity;
    });


    const bestMatch = results[0];
    const secondMatch = results[1];
    const thirdMatch = results[2];


    document.getElementById("resultText").innerHTML = `

        <h2>🏆 Tu jugador más parecido</h2>

        <h1>${bestMatch.player.name}</h1>

        <p style="font-size: 28px; color: white;">
            ${bestMatch.similarity}% de similitud
        </p>

        <hr style="
            border: none;
            border-top: 1px solid #333;
            margin: 35px 0;
        ">

        <h2>🥇 Top 3</h2>

        <p>
            🥇 ${bestMatch.player.name}
            — ${bestMatch.similarity}%
        </p>

        <p>
            🥈 ${secondMatch.player.name}
            — ${secondMatch.similarity}%
        </p>

        <p>
            🥉 ${thirdMatch.player.name}
            — ${thirdMatch.similarity}%
        </p>

    `;

}
